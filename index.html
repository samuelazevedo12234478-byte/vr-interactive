<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Quest Spatial OS - VR Box 2 Mãos Ajustado</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .a-enter-vr { display: none !important; }

    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }

    #hand_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(234, 88, 12, 0.4);
      transition: all 0.2s ease;
    }

    #statusLog {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      color: #1e293b;
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 24px;
      border-radius: 30px;
      border: 2px solid #f97316;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <button id="startBtn">🚀 Iniciar AR (Detecção Precisa)</button>
  <div id="statusLog">Clique para iniciar</div>
  
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="hand_canvas"></canvas>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-entity id="main-camera" camera look-controls="enabled: true; magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    const videoElement = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand_canvas');
    const handCtx = handCanvas.getContext('2d');
    
    const startBtn = document.getElementById('startBtn');
    const statusLog = document.getElementById('statusLog');

    // MEDIAPIPE HANDS - CONFIGURAÇÃO DE ALTA PRECISÃO
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1, // Usa o modelo completo (mais preciso)
      minDetectionConfidence: 0.7, // Aumentado para evitar falsos positivos
      minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
      if (handCanvas.width !== window.innerWidth || handCanvas.height !== window.innerHeight) {
        handCanvas.width = window.innerWidth;
        handCanvas.height = window.innerHeight;
      }

      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawHandMesh(landmarks);
        }
      }

      handCtx.restore();
    });

    function drawHandMesh(landmarks) {
      const screenW = handCanvas.width;
      const screenH = handCanvas.height;

      // Calcula o tamanho da mão dinamicamente baseado na distância do pulso ao dedo médio
      const wrist = landmarks[0];
      const middleTip = landmarks[12];
      const handSize = Math.hypot((middleTip.x - wrist.x) * screenW, (middleTip.y - wrist.y) * screenH);
      
      // Espessura e raio dinâmicos baseados no tamanho real da mão detectada
      const lineWidth = Math.max(3, handSize * 0.02);
      const pointRadius = Math.max(4, handSize * 0.035);

      // Linhas da mão (Laranja)
      for (const connection of HAND_CONNECTIONS) {
        const from = landmarks[connection[0]];
        const to = landmarks[connection[1]];
        
        handCtx.beginPath();
        handCtx.moveTo(from.x * screenW, from.y * screenH);
        handCtx.lineTo(to.x * screenW, to.y * screenH);
        handCtx.strokeStyle = '#f97316';
        handCtx.lineWidth = lineWidth;
        handCtx.stroke();
      }

      // Pontos das articulações (Branco com borda Laranja)
      for (const landmark of landmarks) {
        handCtx.beginPath();
        handCtx.arc(landmark.x * screenW, landmark.y * screenH, pointRadius, 0, 2 * Math.PI);
        handCtx.fillStyle = '#ffffff';
        handCtx.fill();
        handCtx.strokeStyle = '#ea580c';
        handCtx.lineWidth = Math.max(1.5, lineWidth * 0.5);
        handCtx.stroke();
      }
    }

    async function startApp() {
      startBtn.style.display = 'none';

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();
        statusLog.innerText = "✨ Rastreamento Dinâmico de Alta Precisão!";
      } catch (err) {
        statusLog.innerText = "⚠️ Erro ao abrir a câmera.";
      }
    }

    startBtn.addEventListener('click', startApp);
  </script>
</body>
</html>
